logging:
  level:
    com:
      trung: DEBUG
    root: INFO
spring:
  data:
    redis:
      host: redis
      port: 6379
  rabbitmq:
    port: 5672
    host: rabbitmq
    username: admin
    password: admin123
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${POSTGRES_PASSWORD_PROD}
    url: jdbc:postgresql://${POSTGRES_HOST_PROD}:5432/${POSTGRES_DB_PROD}
    username: ${POSTGRES_USER_PROD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.sendgrid.net
    port: 2525
    username: apikey
    password: ${SENDGRID_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
rabbitmq:
  exchange:
    name: intership_exchange
  queue:
    notification: notification_queue
  routing:
    key:
      notification: notification_routing_key

app:
  frontend:
    url: "https://trung1609.github.io/Internship-Management-System"

github:
  client-id: ${GITHUB_CLIENT_ID_PROD}
  client-secret: ${GITHUB_CLIENT_SECRET_PROD}